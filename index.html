<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FF6FA3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học Tiếng Anh">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<title>Bé Học Tiếng Anh – Cả Nhà Cùng Học</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF6FA3;--pinkd:#D94F83;--sky:#3FA9F5;--skyd:#2483C9;--sun:#FFC233;--sund:#D99A0B;--mint:#2FCB97;--mintd:#1E9F75;--grape:#9B6BFF;--graped:#7646DB;--ink:#3B2E5A;--bg:#FFF6E6;--red:#FF5A5A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(#FFE0B0 1.6px,transparent 1.6px) 0 0/22px 22px;min-height:100vh}
#app{max-width:920px;margin:0 auto;padding:12px 12px 60px}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:disabled{cursor:default}
input,select{font-family:inherit;font-size:20px;color:var(--ink)}
a{color:var(--skyd)}
.ipa{font-family:'Noto Sans','Lucida Sans Unicode','Segoe UI',sans-serif;letter-spacing:.3px}
.btn{background:#fff;border-radius:20px;padding:10px 16px;font-size:19px;font-weight:700;box-shadow:0 5px 0 rgba(59,46,90,.18);transition:transform .08s,box-shadow .08s;line-height:1.2}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(59,46,90,.18)}
.btn.sm{font-size:16px;padding:7px 12px;border-radius:14px;box-shadow:0 3px 0 rgba(59,46,90,.16)}
.c-pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pinkd)}
.c-sky{background:var(--sky);color:#fff;box-shadow:0 5px 0 var(--skyd)}
.c-sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sund)}
.c-mint{background:var(--mint);color:#fff;box-shadow:0 5px 0 var(--mintd)}
.c-grape{background:var(--grape);color:#fff;box-shadow:0 5px 0 var(--graped)}
.btn.sm.c-pink{box-shadow:0 3px 0 var(--pinkd)}.btn.sm.c-sky{box-shadow:0 3px 0 var(--skyd)}.btn.sm.c-sun{box-shadow:0 3px 0 var(--sund)}.btn.sm.c-mint{box-shadow:0 3px 0 var(--mintd)}.btn.sm.c-grape{box-shadow:0 3px 0 var(--graped)}
.card{background:#fff;border-radius:24px;padding:16px;box-shadow:0 5px 0 rgba(59,46,90,.12);margin-bottom:14px}
h1{font-size:clamp(30px,6vw,44px);margin:6px 0 2px;line-height:1.1;text-align:center}
h2{font-size:24px;margin:0 0 8px;line-height:1.15}
h3{font-size:20px;margin:4px 0 6px}
p{margin:6px 0}
.sub{text-align:center;font-size:18px;opacity:.75;margin:0 0 12px}
.rainbow span:nth-child(5n+1){color:var(--pink)}.rainbow span:nth-child(5n+2){color:var(--sky)}.rainbow span:nth-child(5n+3){color:var(--sund)}.rainbow span:nth-child(5n+4){color:var(--mint)}.rainbow span:nth-child(5n){color:var(--grape)}
.mascot{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:6px 0 14px}
.mascot .bear{font-size:56px;animation:bob 2.4s ease-in-out infinite}
.bubble{background:#fff;border-radius:22px 22px 22px 6px;padding:9px 15px;font-size:18px;font-weight:600;box-shadow:0 4px 0 rgba(59,46,90,.12);max-width:460px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.kidc{border-radius:30px;padding:18px;text-align:center;color:#fff;font-size:19px;position:relative}
.kidc .nm{font-size:32px;font-weight:800;line-height:1.1;margin-top:6px}
.kidc .meta{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.edit{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.9);color:var(--ink);border-radius:14px;padding:4px 10px;font-weight:800;font-size:15px}
.chip{background:rgba(255,255,255,.28);border-radius:99px;padding:2px 11px;font-weight:700;font-size:16px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;overflow:hidden;flex:none;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ib{width:50px;height:50px;border-radius:16px;background:#fff;font-size:22px;box-shadow:0 4px 0 rgba(59,46,90,.16);flex:none}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,46,90,.16)}
.tt{flex:1;font-size:22px;font-weight:800;line-height:1.1;min-width:0}
.top2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-4px 0 12px}
.lk{font-family:'Noto Sans',sans-serif;color:var(--pink);font-weight:700}
.tt small{display:block;font-size:15px;font-weight:600;opacity:.7}
.pill{background:#fff;border-radius:99px;padding:6px 12px;font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(59,46,90,.12);white-space:nowrap}
button.pill:active{transform:translateY(3px)}
.mission{background:linear-gradient(135deg,#FFE8F1,#E6F4FF);border-radius:26px;padding:14px;margin-bottom:14px;box-shadow:0 5px 0 rgba(59,46,90,.1)}
.tasks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.task{background:#fff;border-radius:16px;padding:8px 4px;text-align:center;font-weight:700;font-size:14px;line-height:1.15;border:3px dashed #E5D9F5}
.task b{display:block;font-size:26px}
.task.ok{border:3px solid var(--mint);background:#E9FBF4}
.bar{height:14px;border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pink));border-radius:99px;transition:width .4s}
.week{display:flex;gap:5px;margin-top:10px}
.day{flex:1;text-align:center;font-size:13px;font-weight:700;background:#fff;border-radius:12px;padding:3px 0}
.day b{display:block;font-size:18px}
.day.today{outline:3px solid var(--sky)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.feature{border-radius:24px;padding:12px;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;text-align:left;line-height:1.15}
.feature .ic{font-size:40px}
.feature small{display:block;font-size:14px;font-weight:600;opacity:.88}
.tabs{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.tab{border-radius:99px;padding:7px 14px;font-weight:800;font-size:17px;background:#fff;box-shadow:0 4px 0 rgba(59,46,90,.12)}
.tab.on{color:#fff;background:var(--grape)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.topic{background:#fff;border-radius:22px;padding:12px 8px 10px;text-align:center;box-shadow:0 5px 0 rgba(59,46,90,.13);border-top:8px solid var(--c,#9B6BFF)}
.topic:active{transform:translateY(3px)}
.topic .ic{font-size:44px;line-height:1.1}
.topic .vi{font-size:18px;font-weight:800;line-height:1.1;margin-top:4px}
.topic .en{font-size:14px;opacity:.65;font-weight:600}
.dots{display:flex;justify-content:center;gap:4px;margin-top:5px;font-size:13px}
.dots span{opacity:.22}.dots span.on{opacity:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border-radius:26px;padding:18px 10px;font-size:22px;font-weight:800;text-align:center;line-height:1.1}
.mode .ic{font-size:50px;display:block;margin-bottom:6px}
.mode small{display:block;font-size:15px;font-weight:600;opacity:.9;margin-top:4px}
.hero{text-align:center;margin-bottom:14px}
.hero .ic{font-size:72px;line-height:1}
.stage{background:#fff;border-radius:30px;padding:20px 14px;text-align:center;box-shadow:0 6px 0 rgba(59,46,90,.12);position:relative;margin-bottom:12px}
.emo{font-size:clamp(100px,24vw,160px);line-height:1.1;display:inline-block}
.num{font-size:clamp(84px,20vw,130px);line-height:1.1;font-weight:800;display:inline-block;color:var(--grape)}
.emo.small{font-size:60px}.num.small{font-size:50px}
.tap{cursor:pointer;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.word{font-size:clamp(38px,9vw,60px);font-weight:800;color:var(--pink);line-height:1.1;margin-top:4px}
.ipabig{font-size:24px;color:var(--skyd);margin-top:2px}
.vi{font-size:22px;font-weight:600;opacity:.78}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:800}
.prog .bar{flex:1;box-shadow:inset 0 0 0 2px #F0E6D6}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav .btn{flex:1;font-size:20px;padding:13px}
.acc{display:inline-flex;background:#fff;border-radius:99px;padding:3px;box-shadow:0 4px 0 rgba(59,46,90,.12)}
.acc button{border-radius:99px;padding:4px 10px;font-weight:800;font-size:15px}
.acc button.on{background:var(--ink);color:#fff}
/* flashcard */
.flip{perspective:1200px;max-width:440px;margin:0 auto;height:min(76vw,360px);cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 7px 0 rgba(59,46,90,.15);padding:12px}
.front{background:linear-gradient(160deg,#fff,#FFF1F7);border:5px solid var(--pink)}
.back{background:linear-gradient(160deg,#fff,#EAF6FF);border:5px solid var(--sky);transform:rotateY(180deg)}
.hint{font-size:16px;opacity:.6;font-weight:600;margin-top:6px}
/* quiz */
.qtitle{font-size:22px;font-weight:800;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opts.one{grid-template-columns:1fr}
.opt{background:#fff;border-radius:22px;padding:10px;font-size:23px;font-weight:800;box-shadow:0 5px 0 rgba(59,46,90,.15);border:4px solid #F3EADF;min-height:80px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.opt .emo{font-size:64px}.opt .num{font-size:54px}
.opt.right{border-color:var(--mint);background:#E4FBF2;animation:pop .4s}
.opt.wrong{border-color:var(--red);background:#FFECEC;opacity:.55;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.blank{font-size:clamp(36px,8vw,54px);font-weight:800;letter-spacing:6px;color:var(--sky)}
.blank u{color:var(--pink);text-decoration:none;border-bottom:5px solid var(--pink);padding:0 4px}
.praise{min-height:32px;font-size:22px;font-weight:800;color:var(--mintd);text-align:center;margin-top:10px}
.praise.no{color:var(--pinkd)}
.why{background:#F3FBF7;border-radius:16px;padding:10px 12px;margin-top:10px;font-size:18px;text-align:left}
.listenbtn{font-size:60px;width:130px;height:130px;border-radius:50%;background:var(--sun);box-shadow:0 7px 0 var(--sund);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.sent{font-size:clamp(26px,6vw,40px);font-weight:800;color:var(--pink);line-height:1.2;margin-top:4px}
.mic{width:120px;height:120px;border-radius:50%;font-size:54px;background:var(--pink);color:#fff;box-shadow:0 7px 0 var(--pinkd);margin-top:12px}
.mic.on{background:var(--red);animation:pulse .8s infinite}
.heard{min-height:30px;font-size:20px;font-weight:600;margin-top:8px;color:var(--skyd)}
.stars3{font-size:40px;letter-spacing:6px;min-height:50px}
.note{font-size:15px;opacity:.72;margin-top:8px}
/* lists */
.li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 12px;margin-bottom:10px;box-shadow:0 4px 0 rgba(59,46,90,.1);text-align:left}
.li .t{flex:1;min-width:0}
.li .en{font-size:21px;font-weight:800;line-height:1.2}
.li .vv{font-size:17px;opacity:.8}
.li .ipa{font-size:16px;color:var(--skyd)}
.li .nt{font-size:15px;color:var(--graped);font-weight:600}
.pb{width:46px;height:46px;border-radius:14px;font-size:21px;background:var(--sky);color:#fff;box-shadow:0 3px 0 var(--skyd);flex:none}
.pb.uk{background:var(--grape);box-shadow:0 3px 0 var(--graped)}
.pb.slow{background:var(--sun);box-shadow:0 3px 0 var(--sund)}
.pb:active{transform:translateY(2px)}
.pbs{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.dlg{display:flex;gap:8px;margin-bottom:10px;align-items:flex-end}
.dlg.B{flex-direction:row-reverse}
.dlg .bb{background:#fff;border-radius:20px 20px 20px 6px;padding:10px 12px;box-shadow:0 4px 0 rgba(59,46,90,.1);max-width:80%;text-align:left}
.dlg.B .bb{border-radius:20px 20px 6px 20px;background:#EAF6FF}
.dlg .who{font-size:30px}
.formula{background:#FFF4D6;border-radius:14px;padding:8px 12px;margin:6px 0;font-weight:700;font-size:19px}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.mist div{border-radius:12px;padding:6px 10px;font-weight:700}
.mist .w{background:#FFECEC;text-decoration:line-through;text-decoration-color:var(--red)}
.mist .r{background:#E4FBF2}
.ipagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ipat{background:#fff;border-radius:16px;padding:8px 4px;text-align:center;box-shadow:0 4px 0 rgba(59,46,90,.12);border-bottom:5px solid var(--c)}
.ipat b{display:block;font-size:28px;font-family:'Noto Sans',sans-serif;font-weight:600}
.ipat span{font-size:13px;opacity:.75}
.badge{display:inline-block;border-radius:99px;padding:1px 9px;font-size:14px;font-weight:800;background:#FFE8F1;color:var(--pinkd);margin-left:4px}
.syls{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.syl{border-radius:14px;padding:6px 12px;font-size:24px;font-weight:700;background:#F3EEFF;color:var(--ink)}
.syl.st{background:var(--pink);color:#fff;font-size:30px;font-weight:800}
.sylbtn{border:3px solid #E5D9F5;background:#fff;box-shadow:0 4px 0 rgba(59,46,90,.12)}
.sylbtn.right{background:var(--mint);color:#fff;border-color:var(--mint)}
.sylbtn.wrong{background:#FFECEC;opacity:.6}
.search{display:flex;gap:8px}
.search input{flex:1;border:3px solid #E5D9F5;border-radius:18px;padding:10px 14px;min-width:0;background:#fff}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.links a{display:block;background:#fff;border-radius:14px;padding:10px 12px;font-weight:700;text-decoration:none;box-shadow:0 3px 0 rgba(59,46,90,.12);color:var(--ink)}
.links a small{display:block;font-weight:600;opacity:.7;font-size:13px}
.result{text-align:center;padding:10px 0}
.result .big{font-size:90px;line-height:1.1}
.result h3{font-size:28px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.stk{background:#fff;border-radius:18px;height:80px;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 4px 0 rgba(59,46,90,.12)}
.stk.no{filter:grayscale(1);opacity:.3;font-size:30px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:9px}
.lt{background:#fff;border-radius:18px;padding:6px 4px;text-align:center;box-shadow:0 4px 0 rgba(59,46,90,.13);border-bottom:6px solid var(--c)}
.lt b{display:block;font-size:36px;line-height:1;color:var(--c)}
.lt span{font-size:28px}
.lt.seen{background:#FFFBEA}
.abcshow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.abcshow .L{font-size:100px;font-weight:800;color:var(--pink);line-height:1}
.field{display:block;margin:10px 0;font-weight:700}
.field input,.field select{display:block;width:100%;margin-top:4px;border:3px solid #E5D9F5;border-radius:14px;padding:8px 12px;background:#fff}
.emopick{display:flex;flex-wrap:wrap;gap:6px}
.emopick button{font-size:34px;width:56px;height:56px;border-radius:14px;background:#fff;box-shadow:0 3px 0 rgba(59,46,90,.12)}
.emopick button.on{outline:4px solid var(--pink)}
.editor{display:flex;flex-direction:column;align-items:center;gap:10px}
.editor canvas{border-radius:50%;box-shadow:0 0 0 6px #fff,0 6px 18px rgba(0,0,0,.18);touch-action:none;cursor:grab;max-width:80vw;height:auto}
.slider{width:100%;max-width:320px;display:flex;align-items:center;gap:8px;font-weight:700}
.slider input{flex:1}
.confetti{position:fixed;top:-60px;font-size:30px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.foot{text-align:center;margin-top:20px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.link{font-size:16px;font-weight:700;text-decoration:underline;opacity:.78;padding:6px}
.err{background:#FFECEC;border-radius:18px;padding:16px;text-align:center}
@media (max-width:560px){.tasks{grid-template-columns:repeat(2,1fr)}.opt{min-height:72px;font-size:20px}.mode{font-size:19px}.mode .ic{font-size:42px}.pb{width:42px;height:42px;font-size:19px}.li .en{font-size:19px}}
</style>
</head>

at","một con mèo","🐱"],["an apple","một quả táo","🍎"],["an egg","một quả trứng","🥚"],["a banana","một quả chuối","🍌"],["an orange","một quả cam","🍊"],["an umbrella","một cái ô","☂️"]],"mistakes":[],"quiz":[{"q":"I have ___ apple.","o":["a","an"],"a":1,"why":"apple bắt đầu bằng âm a → an.","say":"I have an apple."},{"q":"It is ___ dog.","o":["a","an"],"a":0,"why":"dog bắt đầu bằng d → a.","say":"It is a dog."},{"q":"I see ___ elephant.","o":["a","an"],"a":1,"why":"elephant bắt đầu bằng e → an.","say":"I see an elephant."},{"q":"This is ___ kite.","o":["a","an"],"a":0,"why":"kite bắt đầu bằng k → a.","say":"This is a kite."},{"q":"She has ___ orange.","o":["a","an"],"a":1,"why":"orange bắt đầu bằng o → an.","say":"She has an orange."}]},{"id":"k3","lv":"kid","icon":"🐱🐱","vi":"Một và nhiều (số nhiều -s)","en":"Plurals","explain":["Một con: <b>a cat<\/b>. Nhiều con: thêm <b>s<\/b> → <b>cats<\/b>.","Từ tận cùng -s, -x, -ch, -sh thêm <b>es<\/b>: bus → bus<b>es<\/b>, box → box<b>es<\/b>."],"formula":["one cat → two cats","one box → three boxes"],"examples":[["one dog, two dogs","một con chó, hai con chó","🐶"],["one apple, three apples","một quả táo, ba quả táo","🍎"],["one box, two boxes","một cái hộp, hai cái hộp","📦"],["one bus, two buses","một xe buýt, hai xe buýt","🚌"]],"mistakes":[],"quiz":[{"q":"I have two ___.","o":["cat","cats"],"a":1,"why":"two (hai) → số nhiều cats.","say":"I have two cats."},{"q":"There is one ___.","o":["bird","birds"],"a":0,"why":"one (một) → bird.","say":"There is one bird."},{"q":"Three ___ !","o":["boxs","boxes"],"a":1,"why":"box tận cùng x → boxes.","say":"Three boxes !"},{"q":"I see five ___.","o":["ducks","duck"],"a":0,"why":"five → ducks.","say":"I see five ducks."}]},{"id":"k4","lv":"kid","icon":"🙋","vi":"Em là… (I am / You are / He is)","en":"To be: am / is / are","explain":["<b>I<\/b> đi với <b>am<\/b>.","<b>He, She, It<\/b> đi với <b>is<\/b>.","<b>You, We, They<\/b> đi với <b>are<\/b>."],"formula":["I am happy.","She is seven.","They :"___ is your name? – I am An.","o":["What","Where","Who"],"a":0,"why":"Hỏi tên → What.","say":"What is your name? – I am An."},{"q":"___ is the ball? – Under the bed.","o":["What","Where","Who"],"a":1,"why":"Hỏi chỗ → Where.","say":"Where is the ball? – Under the bed."},{"q":"___ is she? – My sister.","o":["What","Where","Who"],"a":2,"why":"Hỏi người → Who.","say":"Who is she? – My sister."},{"q":"How ___ are you? – I am five.","o":["old","many"],"a":0,"why":"Hỏi tuổi → How old.","say":"How old are you? – I am five."}]},{"id":"g1","lv":"adult","icon":"🧱","vi":"Động từ \"to be\": am / is / are","en":"The verb \"to be\"","explain":["\"To be\" nghĩa là <b>là, thì, ở<\/b>. Tiếng Việt hay bỏ chữ \"là\" (Tôi mệt), tiếng Anh <b>bắt buộc có<\/b>: I <b>am<\/b> tired.","Phủ định thêm <b>not<\/b>. Câu hỏi: đưa am/is/are lên đầu."],"formula":["I am / You are / He, She, It is / We, They are","Phủ định: I'm not / He isn't / They aren't","Hỏi: Are you…? Is she…?"],"examples":[["I am tired.","Tôi mệt.",null],["She is a teacher.","Cô ấy là giáo viên.",null],["We are not busy.","Chúng tôi không bận.",null],["Are you ready?","Bạn sẵn sàng chưa?",null],["Is it expensive?","Nó có đắt không?",null]],"mistakes":[["I tired.","I am tired.","Thiếu \"am\" — lỗi người Việt hay mắc."],["She are nice.","She is nice.","She đi với is."]],"quiz":[{"q":"I ___ a content creator.","o":["am","is","are"],"a":0,"why":"I am.","say":"I am a content creator."},{"q":"My nieces ___ very smart.","o":["am","is","are"],"a":2,"why":"Số nhiều → are.","say":"My nieces are very smart."},{"q":"___ you busy now?","o":["Are","Do","Is"],"a":0,"why":"Câu hỏi với tính từ busy dùng to be: Are you…?","say":"Are you busy now?"},{"q":"He ___ at home today. (không ở nhà)","o":["isn't","aren't","don't"],"a":0,"why":"He isn't.","say":"He isn't at home today."},{"q":"The coffee ___ hot.","o":["am","is","are"],"a":1,"why":"Coffee (không đếm được) → is.","say":"The coffee is hot."}]},{"id":"g2","lv":"adult","icon":"🔁","vi":"Thì hiện tại đơn","en":"Present simple","explain":["Dùng cho <b>thói quen, sự thật, lịch cố định<\/b>: I drink coffee every day.","He / She / It: động từ thêm <b>-s/-es<\/b>: she work<b>s<\/b>, he watch<b>es<\/b>.","Phủ định & câu hỏi dùng <b>do / does<\/b> (động từ trở về nguyên mẫu)."],"formula":["I / You / We / They + V","He / She / It + V-s/es","don't / doesn't + V","Do / Does + S + V?"],"examples":[["I work from home.","Tôi làm việc ở nhà.",null],["She lives in Da Nang.","Cô ấy sống ở Đà Nẵng.",null],["He doesn't eat meat.","Anh ấy không ăn thịt.",null],["Do you drink coffee?","Bạn có uống cà phê không?",null],["What time does the shop open?","Cửa hàng mở cửa lúc mấy giờ?",null]],"mistakes":[["She work every day.","She works every day.","Ngôi thứ 3 số ít phải thêm -s."],["He doesn't works.","He doesn't work.","Đã có does thì động từ không thêm -s."],["Do she like it?","Does she like it?","She dùng does."]],"quiz":[{"q":"She ___ in a bank.","o":["work","works","working"],"a":1,"why":"She + works.","say":"She works in a bank."},{"q":"I ___ like spicy food.","o":["don't","doesn't","am not"],"a":0,"why":"I + don't.","say":"I don't like spicy food."},{"q":"___ your sister live with you?","o":["Do","Does","Is"],"a":1,"why":"your sister = she → Does.","say":"Does your sister live with you?"},{"q":"The shop ___ at 9 a.m.","o":["open","opens","is open"],"a":1,"why":"The shop = it → opens.","say":"The shop opens at 9 a.m."},{"q":"We ___ English every evening.","o":["study","studies","studying"],"a":0,"why":"We + study.","say":"We study English every evening."}]},{"id":"g3","lv":"adult","icon":"⏳","vi":"Thì hiện tại tiếp diễn","en":"Present continuous","explain":["Việc <b>đang xảy ra lúc nói<\/b> hoặc <b>kế hoạch đã sắp xếp<\/b> gần.","Cấu trúc: <b>am/is/are + V-ing<\/b>."],"formula":["S + am/is/are + V-ing","Hỏi: Are you + V-ing?"],"examples":[["I'm cooking dinner.","Tôi đang nấu bữa tối.",null],["She's talking on the phone.","Cô ấy đang nói chuyện điện thoại.",null],["Are you working now?","Bạn đang làm việc à?",null],["I'm meeting a client tomorrow.","Mai tôi gặp một khách hàng.",null]],"mistakes":[["I cooking now.","I'm cooking now.","Thiếu am."],["She is work now.","She is working now.","Phải là V-ing."]],"quiz":[{"q":"Look! It ___ .","o":["rains","is raining","rain"],"a":1,"why":"Look! → đang xảy ra.","say":"Look! It is raining ."},{"q":"I ___ a video right now.","o":["make","am making","makes"],"a":1,"why":"right now → tiếp diễn.","say":"I am making a video right now."},{"q":"___ they waiting for us?","o":["Are","Do","Is"],"a":0,"why":"They → Are.","say":"Are they waiting for us?"},{"q":"She usually ___ tea, but today she is drinking coffee.","o":["drinks","is drinking","drink"],"a":0,"why":"usually = thói quen → hiện tại đơn.","say":"She usually drinks tea, but today she is drinking coffee."}]},{"id":"g4","lv":"adult","icon":"⏮️","vi":"Thì quá khứ đơn","en":"Past simple","explain":["Việc <b>đã xong trong quá khứ<\/b> (yesterday, last week, ago).","Động từ có quy tắc thêm <b>-ed<\/b>: work → work<b>ed<\/b>. Bất quy tắc phải học: go → <b>went<\/b>, buy → <b>bought<\/b>, eat → <b>ate<\/b>, see → <b>saw<\/b>.","Phủ định/câu hỏi dùng <b>did<\/b> + động từ nguyên mẫu."],"formula":["S + V-ed / V cột 2","S + didn't + V","Did + S + V?"],"examples":[["I worked yesterday.","Hôm qua tôi làm việc.",null],["We went to the beach last week.","Tuần trước chúng tôi đi biển.",null],["She bought a new phone.","Cô ấy đã mua điện thoại mới.",null],["I didn't see him.","Tôi đã không thấy anh ấy.",null],["Did you eat breakfast?","Bạn đã ăn sáng chưa?",null]],"mistakes":[["I go there yesterday.","I went there yesterday.","yesterday → quá khứ."],["Did you went?","Did you go?","Có did thì động từ nguyên mẫu."]],"quiz":[{"q":"Yesterday I ___ to the market.","o":["go","went","gone"],"a":1,"why":"go → went.","say":"Yesterday I went to the market."},{"q":"She ___ me last night.","o":["call","called","calls"],"a":1,"why":"Có quy tắc → called.","say":"She called me last night."},{"q":"We ___ watch TV yesterday.","o":["didn't","don't","weren't"],"a":0,"why":"Phủ định quá khứ: didn't + V.","say":"We didn't watch TV yesterday."},{"q":"___ you buy it online?","o":["Did","Do","Were"],"a":0,"why":"Câu hỏi quá khứ: Did…?","say":"Did you buy it online?"},{"q":"I ___ a great movie last weekend.","o":["see","saw","seen"],"a":1,"why":"see → saw.","say":"I saw a great movie last weekend."}]},{"id":"g5","lv":"adult","icon":"⏭️","vi":"Tương lai: will & be going to","en":"Future: will / going to","explain":["<b>will<\/b>: quyết định ngay lúc nói, hứa hẹn, dự đoán: I'll help you.","<b>be going to<\/b>: kế hoạch đã định trước: I'm going to start a new job."],"formula":["S + will + V","S + am/is/are going to + V","won't = will not"],"examples":[["I'll call you later.","Tôi sẽ gọi bạn sau.",null],["It will rain tomorrow.","Mai trời sẽ mưa.",null],["I'm going to learn English every day.","Tôi định học tiếng Anh mỗi ngày.",null],["We're going to visit my parents.","Chúng tôi sẽ thăm bố mẹ.",null]],"mistakes":[["I will to call you.","I will call you.","Sau will là động từ nguyên mẫu, không có to."]],"quiz":[{"q":"The phone is ringing. – I ___ answer it.","o":["will","am going to"],"a":0,"why":"Quyết định ngay → will.","say":"The phone is ringing. – I will answer it."},{"q":"I bought a ticket. I ___ fly to Hanoi next week.","o":["will","am going to"],"a":1,"why":"Đã lên kế hoạch → going to.","say":"I bought a ticket. I am going to fly to Hanoi next week."},{"q":"I promise I ___ be late.","o":["won't","don't","am not"],"a":0,"why":"Hứa → won't.","say":"I promise I won't be late."},{"q":"She is going ___ open a shop.","o":["to","for","will"],"a":0,"why":"going to + V.","say":"She is going to open a shop."}]},{"id":"g6","lv":"adult","icon":"🙏","vi":"Can / Could — nhờ vả lịch sự","en":"Can / Could","explain":["<b>can<\/b>: khả năng (I can swim) hoặc xin phép/nhờ (Can I…? Can you…?).","<b>could<\/b>: nhờ vả <b>lịch sự hơn<\/b>: Could you help me?"],"formula":["S + can / can't + V","Can I + V? (xin phép)","Could you + V, please? (nhờ lịch sự)"],"examples":[["I can speak a little English.","Tôi nói được chút tiếng Anh.",null],["Can I sit here?","Tôi ngồi đây được không?",null],["Could you help me, please?","Bạn giúp tôi được không ạ?",null],["I can't hear you.","Tôi không nghe thấy bạn.",null]],"mistakes":[["I can to swim.","I can swim.","Sau can không có to."],["Can you helping me?","Can you help me?","Sau can là V nguyên mẫu."]],"quiz":[{"q":"___ you open the window, please?","o":["Could","Do","Are"],"a":0,"why":"Nhờ lịch sự → Could you…","say":"Could you open the window, please?"},{"q":"I ___ drive. I don't have a license.","o":["can","can't"],"a":1,"why":"Không có bằng → can't.","say":"I can't drive. I don't have a license."},{"q":"Can I ___ your pen?","o":["use","to use","using"],"a":0,"why":"Can + V nguyên mẫu.","say":"Can I use your pen?"},{"q":"She can ___ three languages.","o":["speaks","speak","speaking"],"a":1,"why":"can + speak.","say":"She can speak three languages."}]},{"id":"g7","lv":"adult","icon":"🧭","vi":"Đặt câu hỏi đúng thứ tự","en":"Question word order","explain":["Thứ tự: <b>Từ để hỏi + trợ động từ + chủ ngữ + động từ<\/b>?","Từ để hỏi: What (gì), Where (đâu), When (khi nào), Who (ai), Why (tại sao), How (thế nào), How much (bao nhiêu tiền), How long (bao lâu)."],"formula":["Wh- + do/does/did + S + V?","Wh- + am/is/are + S …?"],"examples":[["Where do you live?","Bạn sống ở đâu?",null],["What time does the store close?","Cửa hàng đóng cửa lúc mấy giờ?",null],["Why are you late?","Sao bạn đến muộn?",null],["How long did you stay there?","Bạn ở đó bao lâu?",null]],"mistakes":[["Where you live?","Where do you live?","Thiếu trợ động từ do."],["What time the store closes?","What time does the store close?","Cần does, động từ bỏ -s."]],"quiz":[{"q":"Where ___ you work?","o":["do","are","does"],"a":0,"why":"Where do you work?","say":"Where do you work?"},{"q":"What ___ your name?","o":["is","do","does"],"a":0,"why":"What is your name?","say":"What is your name?"},{"q":"___ much is this?","o":["How","What","Why"],"a":0,"why":"Hỏi giá: How much.","say":"How much is this?"},{"q":"When ___ she arrive yesterday?","o":["did","does","do"],"a":0,"why":"yesterday → did.","say":"When did she arrive yesterday?"},{"q":"___ are you sad? – Because I lost my job.","o":["Why","Who","Where"],"a":0,"why":"Hỏi lý do → Why.","say":"Why are you sad? – Because I lost my job."}]},{"id":"g8","lv":"adult","icon":"🧂","vi":"Đếm được & không đếm được","en":"Countable / Uncountable","explain":["Đếm được: an apple, two apples. Không đếm được: water, money, rice, information (không thêm -s).","<b>many<\/b> + danh từ đếm được; <b>much<\/b> + không đếm được. <b>some<\/b> (câu khẳng định, mời), <b>any<\/b> (phủ định, câu hỏi)."],"formula":["How many + N-s?","How much + N (không đếm được)?","some / any"],"examples":[["How many people are there?","Có bao nhiêu người?",null],["How much money do you have?","Bạn có bao nhiêu tiền?",null],["I need some water.","Tôi cần ít nước.",null],["We don't have any sugar.","Chúng ta không còn chút đường nào.",null],["Would you like some tea?","Bạn uống chút trà nhé?",null]],"mistakes":[["How many money?","How much money?","money không đếm được."],["informations","information","Không thêm -s."]],"quiz":[{"q":"How ___ eggs do we need?","o":["many","much"],"a":0,"why":"eggs đếm được → many.","say":"How many eggs do we need?"},{"q":"How ___ time do you have?","o":["many","much"],"a":1,"why":"time (thời gian) không đếm được → much.","say":"How much time do you have?"},{"q":"Is there ___ milk in the fridge?","o":["any","some","many"],"a":0,"why":"Câu hỏi → any.","say":"Is there any milk in the fridge?"},{"q":"I'd like ___ coffee, please.","o":["some","any","many"],"a":0,"why":"Khẳng định/mời → some.","say":"I'd like some coffee, please."}]},{"id":"g9","lv":"adult","icon":"📏","vi":"So sánh hơn & hơn nhất","en":"Comparatives & Superlatives","explain":["Tính từ ngắn: thêm <b>-er / -est<\/b>: cheap → cheap<b>er<\/b> → the cheap<b>est<\/b>.","Tính từ dài: <b>more / the most<\/b>: expensive → <b>more<\/b> expensive → <b>the most<\/b> expensive.","Bất quy tắc: good → better → the best; bad → worse → the worst."],"formula":["A is + adj-er + than B","A is more + adj + than B","the + adj-est / the most + adj"],"examples":[["This bag is cheaper than that one.","Túi này rẻ hơn túi kia.",null],["This phone is more expensive.","Điện thoại này đắt hơn.",null],["It's the best coffee in town.","Đây là cà phê ngon nhất thành phố.",null],["Today is hotter than yesterday.","Hôm nay nóng hơn hôm qua.",null]],"mistakes":[["more cheaper","cheaper","Không dùng more với -er."],["gooder","better","good → better."]],"quiz":[{"q":"This dress is ___ than that one.","o":["cheaper","more cheap","cheapest"],"a":0,"why":"cheap ngắn → cheaper.","say":"This dress is cheaper than that one."},{"q":"It's the ___ beautiful place I know.","o":["more","most","much"],"a":1,"why":"the most + adj dài.","say":"It's the most beautiful place I know."},{"q":"My English is ___ now.","o":["better","gooder","best"],"a":0,"why":"good → better.","say":"My English is better now."},{"q":"This is the ___ day of the year.","o":["hottest","hotter","most hot"],"a":0,"why":"the hottest.","say":"This is the hottest day of the year."}]},{"id":"g10","lv":"adult","icon":"🏅","vi":"Hiện tại hoàn thành (kinh nghiệm)","en":"Present perfect","explain":["Nói về <b>trải nghiệm<\/b> (đã từng) hoặc việc <b>vừa xong / kéo dài đến nay<\/b>.","Cấu trúc: <b>have / has + V3<\/b> (quá khứ phân từ): been, seen, done, eaten, worked."],"formula":["S + have/has + V3","Have you ever + V3?","for + khoảng thời gian / since + mốc"],"examples":[["I have been to Da Lat.","Tôi đã từng đến Đà Lạt.",null],["Have you ever eaten durian?","Bạn đã từng ăn sầu riêng chưa?",null],["She has worked here for two years.","Cô ấy đã làm ở đây được hai năm.",null],["I have just finished the video.","Tôi vừa làm xong video.",null]] const KEY='be_hoc_tieng_anh_v2';
function mk(o){return Object.assign({stars:0,streak:0,last:'',days:[],today:{},stickers:[],done:{},abcSeen:[],acc:'us',photo:null,recent:[]},o)}

const me=()=>DB.p[DB.cur];

function dstr(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function yest(){const d=new Date();d.setDate(d.getDate()-1);return dstr(d)}
function ensureToday(k){if(!k.today||k.today.d!==dstr())k.today={d:dstr()}}
function streakNow(k){return (k.last===dstr()||k.last===yest())?k.streak:0}
function addStars(n){const k=me();if(!k)return;k.stars+=n;save();const p=document.getElementById('starpill');if(p)p.textContent='⭐ '+k.stars}
function giveSticker(){const k=me();const left=STICKERS.filter(s=>!k.stickers.includes(s));const s=left.length?pick(left):pick(STICKERS);if(!k.stickers.includes(s))k.stickers.push(s);save();return s}
function tasksOf(k){return k.kind==='adult'?ADULT_TASKS:KID_TASKS}
/* đánh dấu nhiệm vụ; trả về dòng chúc mừng nếu vừa hoàn thành cả 4 */
function markTask(task,topic,val){
  const k=me();ensureToday(k);if(topic){k.done[topic]=k.done[topic]||{};k.done[topic][task]=Math.max(k.done[topic][task]||0,val||1)}
  k.today[task]=1;let msg='';
  const t=k.today;if(tasksOf(k).every(x=>t[x[0]])&&!t.rewarded){t.rewarded=1;
    if(k.last!==dstr()){k.streak=(k.last===yest())?k.streak+1:1;k.last=dstr()}
    if(!k.days.includes(dstr()))k.days.push(dstr());if(k.days.length>120)k.days=k.days.slice(-120);
    const s=giveSticker();k.stars+=5;msg=`<div class="why" style="text-align:center;font-size:20px">🎯 <b>Hoàn thành nhiệm vụ hôm nay!</b><br>Sticker mới ${s} · +5 ⭐ · Chuỗi 🔥 ${k.streak} ngày</div>`;}
  save();return msg;
}

const rand=n=>Math.floor(Math.random()*n);
const pick=a=>a[rand(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const isTxt=e=>/^[A-Za-z0-9]{1,3}$/.test(e);
const pic=(e,cls='')=>isTxt(e)?`<span class="num ${cls}">${e}</span>`:`<span class="emo ${cls}">${e}</span>`;

const ip=pair=>pair?(acc()==='uk'?pair[0]:pair[1]):'';
const slash=s=>s?`<span class="ipa">/${esc(s)}/</span>`:'';
function rainbow(t){return [...t].map(c=>c===' '?' ':`<span>${c}</span>`).join('')}
function avatar(p,size){size=size||56;return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.72)}px">${p.photo?`<img src="${p.photo}" alt="">`:p.av}</span>`}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#3B2E5A;color:#fff;padding:10px 16px;border-radius:16px;z-index:99;font-weight:700;max-width:90vw;text-align:center;pointer-events:none';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function confetti(){const set=['🎉','⭐','🌟','💖','🎈','✨','🍭','🌈'];for(let i=0;i<22;i++){const s=document.createElement('div');s.className='confetti';s.textContent=pick(set);s.style.left=rand(100)+'vw';s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3800)}}
const key=t=>/^[A-Za-z][A-Za-z'\-]*$/.test(t.trim())?t.trim().toLowerCase():t.trim();
/* đăng ký văn bản để phát âm bằng nút: data-say="id" */
let SAYS=[];function sid(t){SAYS.push(t);return SAYS.length-1}
function pbtn(t,opt){opt=opt||{};const i=sid(t);let h='';
  if(opt.both){h+=`<button class="pb" data-act="say" data-arg="${i}" data-acc="us" title="Giọng Mỹ">🇺🇸</button><button class="pb uk" data-act="say" data-arg="${i}" data-acc="uk" title="Giọng Anh">🇬🇧</button>`}
  else h+=`<button class="pb" data-act="say" data-arg="${i}" title="Nghe">🔊</button>`;
  if(opt.slow!==false)h+=`<button class="pb slow" data-act="say" data-arg="${i}" data-slow="1" title="Nghe chậm">🐢</button>`;
  return `<span class="pbs">${h}</span>`}

/* ============ ÂM THANH ============ */
const AE=new Audio();AE.preload='auto';
const BUNDLES={uk:{},us:{}},LOADING={};
function bundleFor(t){const m=MANI[key(t)];return m||null}
function loadBundle(a,b){const id=a+'/'+b;if(BUNDLES[a][b])return Promise.resolve(BUNDLES[a][b]);if(LOADING[id])return LOADING[id];
  if(window.AUDIO_GROUPED){const g=b.startsWith('k-')?'kids':(b==='abc'||b.startsWith('p-'))?'pron':b.startsWith('a-')?'talk':b.startsWith('g-')?'gram':(b<'d-m'?'dict1':'dict2');const gid=a+'/'+g;
    LOADING[id]=(LOADING[gid]=LOADING[gid]||fetch('audio/'+a+'/'+g+'.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(all=>{Object.assign(BUNDLES[a],all);return all}).catch(e=>{delete LOADING[gid];throw e})).then(all=>{if(!all[b])throw new Error('nf');return all[b]}).catch(e=>{delete LOADING[id];throw e});return LOADING[id]}
  LOADING[id]=fetch('audio/'+a+'/'+b+'.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{BUNDLES[a][b]=j;return j}).catch(e=>{delete LOADING[id];throw e});return LOADING[id]}
function preload(texts,a){a=a||acc();const bs=new Set();texts.forEach(t=>{const m=bundleFor(t);if(m)bs.add(m[0])});bs.forEach(b=>loadBundle(a,b).catch(()=>{}))}
let VOICES=[];function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function voiceFor(a){const want=a==='uk'?/en[-_]GB/i:/en[-_]US/i;const vs=VOICES.filter(v=>want.test(v.lang));
  const pref=a==='uk'?['Google UK English Female','Serena','Kate','Daniel','Microsoft Sonia','Microsoft Libby','Microsoft Hazel']:['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Zira','Allison','Ava'];
  for(const p of pref){const f=vs.find(v=>v.name.indexOf(p)>=0);if(f)return f}return vs[0]||null}
let TTS=null,DICT_CAP=null,SAMPLE=null;
function fallbackSay(t,a,slow){const v=voiceFor(a);
  if(v){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=slow?0.6:0.9;speechSynthesis.speak(u);return}catch(e){}}
  if(TTS){TTS.speak(t,{language:'en',rate:slow?0.7:0.95}).catch(()=>{});return}
  if(Date.now()-(window._ft||0)>15000){window._ft=Date.now();toast('Chưa có giọng đọc '+(a==='uk'?'Anh–Anh':'Anh–Mỹ')+' cho mục này. Hãy kiểm tra mạng.')}}
function stopAudio(){try{AE.pause()}catch(e){}try{speechSynthesis.cancel()}catch(e){}try{TTS&&TTS.stop&&TTS.stop()}catch(e){}}
function playData(b64,slow){return new Promise(res=>{try{AE.pause();AE.src='data:audio/mpeg;base64,'+b64;AE.playbackRate=slow?0.72:1;try{AE.preservesPitch=true}catch(e){}
  AE.onended=()=>res();AE.onerror=()=>res();const p=AE.play();if(p&&p.catch)p.catch(()=>res())}catch(e){res()}})}
/* phát âm thanh chuẩn; trả về Promise khi đọc xong */
function say(t,o){o=o||{};const a=o.acc||acc();t=String(t);const m=bundleFor(t);stopAudio();
  if(m){const b=BUNDLES[a][m[0]];
    if(b&&b[m[1]])return playData(b[m[1]],o.slow);
    return loadBundle(a,m[0]).then(j=>j[m[1]]?playData(j[m[1]],o.slow):fallbackSay(t,a,o.slow)).catch(()=>fallbackSay(t,a,o.slow))}
  fallbackSay(t,a,o.slow);return Promise.resolve()}
let AC=null;
function beep(type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const notes=type==='ok'?[660,880]:type==='win'?[523,659,784,1047]:[330,247];
  notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.11;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.22)})}catch(e){}}

/* ============ NHẬN DIỆN GIỌNG NÓI ============ */
const REC={mode:null,on:false,fin:'',part:'',cb:null};
const WebSR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IN_CLAUDE=!!(window.claude&&window.claude.use);
if(!IN_CLAUDE&&WebSR)REC.mode='web';
function initCaps(){if(!(window.claude&&window.claude.use))return false;
  window.claude.use('tts').then(t=>{TTS=t}).catch(()=>{});
  window.claude.use('sample').then(s=>{SAMPLE=s;if(SCR==='dict')render()}).catch(()=>{});
  window.claude.use('dictation').then(d=>{if(!d)return;DICT_CAP=d;REC.mode='claude';
    try{d.onPartial(({text})=>{REC.part=text;recUpd()});d.onFinal(({text})=>{REC.fin=(REC.fin+' '+text).trim();REC.part='';recUpd()});
      d.onState(({state})=>{if(state==='idle'&&REC.on){REC.on=false;recDone()}})}catch(e){}
    if(document.getElementById('micbox'))render()}).catch(()=>{});return true}
if(!initCaps())setTimeout(initCaps,800);
function recUpd(){const h=document.getElementById('heard');if(h){const t=(REC.fin+' '+REC.part).trim();h.textContent=t?'Bạn vừa nói: “'+t+'”':''}}
function recDone(){clearTimeout(REC.tm);const b=document.getElementById('micbtn');if(b){b.classList.remove('on');b.textContent='🎤'}const cb=REC.cb;REC.cb=null;if(cb)cb((REC.fin+' '+REC.part).trim())}
function recStart(cb){
  if(REC.on){recStop();return}
  stopAudio();REC.fin='';REC.part='';REC.cb=cb;
  const b=document.getElementById('micbtn');const n=document.getElementById('micnote');
  if(REC.mode==='claude'&&DICT_CAP){
    DICT_CAP.start().catch(err=>{const c=String((err&&(err.code||err.message))||err);REC.on=false;if(/not_granted/.test(c)){REC.mode=null;render()}else if(n)n.textContent='Chưa bật được micro, bấm 🎤 lần nữa nhé.';if(b){b.classList.remove('on');b.textContent='🎤'}});
  }else if(REC.mode==='web'){
    try{const r=new WebSR();REC.web=r;r.lang=acc()==='uk'?'en-GB':'en-US';r.interimResults=true;r.maxAlternatives=3;
      r.onresult=e=>{let f='',p='';for(let i=0;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)f+=x[0].transcript+' ';else p+=x[0].transcript}REC.fin=f.trim();REC.part=p;recUpd()};
      r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){REC.mode=null;REC.on=false;toast('Chưa được phép dùng micro. Bạn có thể tự chấm bằng nút ⭐.');render()}};
      r.onend=()=>{if(REC.on){REC.on=false;recDone()}};r.start()}catch(e){REC.mode=null;render();return}
  }else return;
  REC.on=true;if(b){b.classList.add('on');b.textContent='⏹️'}if(n)n.textContent='Đang nghe… nói đi nào! (bấm ⏹️ khi xong)';
  const h=document.getElementById('heard');if(h)h.textContent='';const r=document.getElementById('spres');if(r)r.innerHTML='';
  clearTimeout(REC.tm);REC.tm=setTimeout(()=>{if(REC.on)recStop()},9000);
}
function recStop(){if(REC.mode==='claude'&&DICT_CAP)DICT_CAP.stop().catch(()=>{});else if(REC.web)try{REC.web.stop()}catch(e){}}
const NUMW={'1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve','13':'thirteen','14':'fourteen','15':'fifteen','16':'sixteen','17':'seventeen','18':'eighteen','19':'nineteen','20':'twenty'};
function norm(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function grade(target,heard){const tw=norm(target).split(' ').filter(Boolean);const h=norm(heard).split(' ').filter(Boolean).map(x=>NUMW[x]||x);
  if(!h.length)return {stars:'',msg:'Chưa nghe thấy gì, nói to và rõ hơn nhé! 🔊',bad:true};
  let hit=0;const miss=[];tw.forEach(t=>{if(h.some(x=>x===t||(t.length>3&&lev(x,t)<=1)||x.replace(/'/g,'')===t.replace(/'/g,'')))hit++;else miss.push(t)});
  const r=hit/tw.length;
  if(r>=0.8)return {stars:'⭐⭐⭐',msg:pick(PRAISE_VI)+' Phát âm rất tốt!',n:2};
  if(r>=0.5)return {stars:'⭐⭐',msg:'Gần đúng rồi! Chú ý từ: <b>'+esc(miss.join(', '))+'</b>',n:1};
  return {stars:'⭐',msg:'Nghe mẫu thêm rồi thử lại nhé! 💪'+(miss.length?' Từ cần luyện: <b>'+esc(miss.slice(0,4).join(', '))+'</b>':''),bad:true}}
/* khối luyện nói dùng chung */
function micBox(text){return `<div id="micbox">${REC.mode?`<button class="mic" id="micbtn" data-act="mic">🎤</button><div class="note" id="micnote">Bấm 🎤 rồi đọc to, rõ ràng.</div><div class="heard" id="heard"></div>`:
  `<div class="note" style="font-size:18px;font-weight:700;opacity:.9">🗣️ Nghe mẫu rồi đọc to theo 2–3 lần.</div>`}
  <div id="spres"></div>
  <div class="ctrl">${REC.mode?'':`<button class="btn c-mint" data-act="selfok">⭐ Đã đọc tốt</button>`}</div>
  ${REC.mode?`<div class="note"><button class="link" data-act="selfok">Micro không nghe được? Bấm vào đây nếu đã đọc đúng ⭐</button></div>`:''}</div>`}

/* ============ ĐIỀU HƯỚNG (có nút quay lại của điện thoại) ============ */
let SCR='',ARG='',S={};
function nav(r){r=r||'start';if(('#'+r)===location.hash){S={};SCR='';render()}else location.hash=r}

const $app=document.getElementById('app');
const R={};
function render(){
  const h=(location.hash||'').replace(/^#/,'')||'start';
  const i=h.indexOf('-');const scr=i<0?h:h.slice(0,i);const arg=i<0?'':h.slice(i+1);
  if(REC.on)recStop();stopAudio();SAYS=[];
  if(scr!==SCR||arg!==ARG){S={};SCR=scr;ARG=arg}
  try{
    if(scr!=='start'&&scr!=='profile'&&scr!=='photo'&&scr!=='tips'&&scr!=='install'&&!me()){SCR='start';R.start();return}

  }catch(e){console.error(e);$app.innerHTML=`<div class="err"><h2>Ôi, có lỗi nhỏ 😅</h2><p>${esc(e.message)}</p><button class="btn c-pink" data-act="go" data-arg="home">🏠 Về trang chính</button></div>`}
  if(S.scrollTop!==false)window.scrollTo(0,0);
}

function drawCv(target,size){const cv=target||document.getElementById('cv');if(!cv||!S.img)return;size=size||300;const c=cv.getContext('2d');const img=S.img,E=S.edit;
  c.save();c.fillStyle='#fff';c.fillRect(0,0,size,size);const k=size/300;c.translate(size/2+E.x*k,size/2+E.y*k);c.rotate(E.r*Math.PI/180);
  const rot=E.r%180!==0;const iw=rot?img.height:img.width,ih=rot?img.width:img.height;const base=Math.max(size/iw,size/ih)*E.z;
  try{c.filter='brightness('+E.b+'%)'}catch(e){}c.drawImage(img,-img.width*base/2,-img.height*base/2,img.width*base,img.height*base);c.restore()}

/* ---- bài tập chung ---- */
function runQuiz(o){ /* o: {title, back, qs:[{type,html,say,opts:[{h,ok}],why,after}], onEnd(score,total)} */
  S.qz=S.qz||{i:0,score:0,tok:Math.random()};const z=S.qz;
  if(z.i>=o.qs.length){o.onEnd(z.score,o.qs.length);return}
  const q=o.qs[z.i];
  $app.innerHTML=`${header(o.title,o.back,'Bài tập')}
  <div class="prog"><span>Câu ${z.i+1}/${o.qs.length}</span><div class="bar"><i style="width:${z.i/o.qs.length*100}%"></i></div><span>✅ ${z.score}</span></div>
  <div class="stage">${q.html}${q.say&&q.listen?`<div><button class="listenbtn" data-act="qsay">🔊</button><div class="note">Bấm loa để nghe lại · <button class="link" data-act="qsayslow">🐢 nghe chậm</button></div></div>`:''}
   <div class="opts ${q.one?'one':''}" ${q.cols?`style="grid-template-columns:repeat(${q.cols},1fr)"`:''}>${q.opts.map((x,i)=>`<button class="opt" data-act="ans" data-arg="${i}">${x.h}</button>`).join('')}</div>
   <div class="praise" id="praise"></div><div id="whybox"></div></div>`;
  S.quiz=o;q.tries=0;q.locked=false;
  if(q.say&&q.listen)say(q.say);
}
function answer(i,el){const o=S.quiz,z=S.qz;const q=o.qs[z.i];if(!q||q.locked)return;const x=q.opts[+i];const pr=document.getElementById('praise');
  if(x.ok){q.locked=true;el.classList.add('right');beep('ok');if(q.tries===0){z.score++;addStars(1)}pr.className='praise';pr.textContent=pick(PRAISE_VI);
    if(q.after)q.after();if(q.why)document.getElementById('whybox').innerHTML=`<div class="why">💡 ${q.why}</div>`;
    const tok=z.tok;const go=()=>{if(S.qz!==z||z.tok!==tok)return;z.i++;runQuiz(o)};
    const p=q.say?say(q.say):Promise.resolve();
    if(q.why){document.getElementById('whybox').innerHTML+=`<div class="ctrl"><button class="btn c-pink" data-act="qnext">Câu tiếp ➡️</button></div>`;S.qnext=go}
    else Promise.race([p,new Promise(r=>setTimeout(r,2600))]).then(()=>setTimeout(go,500));
  }else{q.tries++;el.classList.add('wrong');el.disabled=true;beep('no');pr.className='praise no';pr.textContent='Chưa đúng, thử lại nhé! 💪'}}
R.quiz=(id)=>{const tp=TOP[id];if(!tp){nav('home');return}preload(tp.words.map(x=>x.w));
  if(!S.qs){const k=me();const QN=8;let ws=shuffle(tp.words);while(ws.length<QN)ws=ws.concat(shuffle(tp.words));ws=ws.slice(0,QN);
    const small=k.kind!=='adult'&&k.lv===1;
    S.qs=ws.map(w=>{let types=small?['listen']:['listen','pic','pic'];if(!small&&/^[a-z]{3,}$/i.test(w.w))types.push('spell');const type=pick(types);
      if(type==='spell'){const vow=[...w.w].map((c,i)=>/[aeiou]/i.test(c)?i:-1).filter(i=>i>=0);const idx=vow.length&&Math.random()<.6?pick(vow):rand(w.w.length);const L=w.w[idx].toLowerCase();
        const q={say:w.w,cols:3,html:`<div class="qtitle">🔤 Chọn chữ cái còn thiếu</div>${pic(w.e,'small')}<div class="blank" id="blank">${[...w.w].map((c,i)=>i===idx?'<u>_</u>':esc(c)).join('')}</div><div class="vi">${esc(w.v)}</div>`,
          opts:shuffle([L,...shuffle('abcdefghijklmnoprstuwy'.split('').filter(c=>c!==L)).slice(0,2)]).map(c=>({h:`<span style="font-size:44px">${c}</span>`,ok:c===L}))};
        q.after=()=>{const b=document.getElementById('blank');if(b)b.innerHTML=[...w.w].map((c,i)=>i===idx?`<u>${esc(c)}</u>`:esc(c)).join('')};return q}
      const others=shuffle(tp.words.filter(x=>x.w!==w.w&&x.e!==w.e)).slice(0,3);const all=shuffle([w,...others]);

/* ---- luyện nói chung ---- */
function runSpeak(o){ /* o:{title,back,items:[{t,v,e,ipa}],onEnd} */
  S.sp=S.sp||{i:0,good:0};const z=S.sp;if(z.i>=o.items.length){o.onEnd(z.good,o.items.length);return}
  const it=o.items[z.i];const isS=/\s/.test(it.t.trim());preload(o.items.map(x=>x.t));
  $app.innerHTML=`${header(o.title,o.back,'Luyện nói')}
  <div class="prog"><span>${z.i+1}/${o.items.length}</span><div class="bar"><i style="width:${(z.i+1)/o.items.length*100}%"></i></div></div>
  <div class="stage">${it.e?pic(it.e,isS?'small':''):''}<div class="${isS?'sent':'word'}">${esc(it.t)}</div><div class="ipabig" style="font-size:19px">${slash(ip(it.ipa))}</div><div class="vi">${esc(it.v||'')}</div>
   <div class="ctrl">${pbtn(it.t,{both:true})}</div>${micBox(it.t)}
   <div class="ctrl" id="nextbox" style="display:none"><button class="btn c-pink" data-act="spnext">${z.i===o.items.length-1?'Xong rồi 🎉':'Câu tiếp ➡️'}</button></div>
   <div class="note"><button class="link" data-act="spnext">Bỏ qua câu này ⏭️</button></div></div>`;
  S.speakO=o;S.speakT=it.t;say(it.t);
}
function speakResult(r){const z=S.sp;const box=document.getElementById('spres');if(!box)return;
  box.innerHTML=`<div class="stars3">${r.stars}</div><div class="praise ${r.bad?'no':''}">${r.msg}</div>`;
  if(!r.bad){if(!S.spGot){S.spGot=1;z.good++;addStars(r.n)}beep('ok');document.getElementById('nextbox').style.display='flex'}else beep('no')}

  <div class="card" style="font-size:17px"><ul style="padding-left:20px">
  <li><b>Học 10–20 phút mỗi ngày</b> vào giờ cố định. Làm đủ 4 nhiệm vụ để giữ chuỗi ngày 🔥.</li>
  <li><b>Giọng đọc:</b> nút 🇺🇸 / 🇬🇧 ở trên cùng đổi giọng Mỹ / Anh cho cả app. Âm thanh được làm sẵn bằng giọng đọc chuẩn, phiên âm theo từ điển, nên các máy đều nghe giống nhau. Nên chọn <b>một giọng chính</b> để học, giọng còn lại để nghe hiểu.</li>
  <li><b>An Di (lớp lá):</b> 🔤 ABC + chủ đề 🌱 Mầm non. Bài tập chỉ cần nghe và chọn hình.</li>
  <li><b>Tuệ An (lớp 2):</b> chủ đề 🌟 Lớp 1–2 + 📘 Ngữ pháp cho bé.</li>
  <li><b>Thu Hiền:</b> mỗi ngày 1 bài 💬 Giao tiếp + 1 phần 🗣️ Phát âm (bắt đầu từ bảng 44 âm IPA) + 1 bài 📘 Ngữ pháp, rồi 🎤 luyện nói.</li>
  <li><b>Luyện nói:</b> bấm 🎤 và cho phép micro, app sẽ chấm sao và chỉ ra từ cần luyện. Nếu máy không có micro, nghe mẫu rồi đọc theo và tự bấm ⭐.</li>
  <li><b>Đổi tên, ảnh:</b> ở màn hình chọn người học, bấm ✏️ Sửa → 🖼️ Chọn ảnh của bé → kéo, phóng to, xoay, chỉnh sáng → ✅.</li>
  <li><b>Quay lại:</b> dùng nút ⬅️ hoặc 🏠 trên cùng, hoặc nút quay lại của điện thoại.</li>
  <li>Tiến độ, sao, ảnh được lưu riêng trên từng máy/trình duyệt.</li></ul></div>`;
};
R.install=()=>{
  $app.innerHTML=`<div class="top"><button class="ib" data-act="go" data-arg="${me()?'home':'start'}">⬅️</button><div class="tt">📱 Cài lên điện thoại</div></div>
  <div class="card" style="font-size:17px"><h3>🤖 Điện thoại Android (Chrome)</h3><ol style="padding-left:20px"><li>Mở link app bằng <b>Chrome</b>.</li><li>Bấm nút <b>⋮</b> (góc trên bên phải).</li><li>Chọn <b>“Thêm vào màn hình chính”</b> hoặc <b>“Cài đặt ứng dụng”</b>.</li><li>Biểu tượng 🐻 “Học Tiếng Anh” sẽ hiện trên màn hình như một app.</li></ol></div>
  <div class="card" style="font-size:17px"><h3>🍎 iPhone / iPad (Safari)</h3><ol style="padding-left:20px"><li>Mở link app bằng <b>Safari</b>.</li><li>Bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên lên).</li><li>Kéo xuống, chọn <b>“Thêm vào MH chính”</b>.</li><li>Bấm <b>Thêm</b>.</li></ol></div>
  <div class="card note" style="font-size:16px;opacity:1">Sau khi cài, app mở toàn màn hình, có biểu tượng riêng. Lần đầu cần có mạng để tải âm thanh; các bài đã mở sẽ dùng được khi không có mạng.</div>`;
};

/* ============ XỬ LÝ NÚT BẤM ============ */
const ACT={
  go:a=>nav(a),
  pickp:a=>{DB.cur=a;save();S={};SCR='';nav('home')},
  acc:a=>{me().acc=a;save();BUNDLES[a]=BUNDLES[a]||{};render();toast(a==='uk'?'🇬🇧 Đã chuyển sang giọng Anh–Anh':'🇺🇸 Đã chuyển sang giọng Anh–Mỹ')},
  tab:a=>{S.tab=+a;R.home()},
  say:(a,el)=>say(SAYS[+a],{acc:el.dataset.acc||acc(),slow:!!el.dataset.slow}),
  sayx:(a,el)=>say(SAYS[+a],{acc:el.dataset.acc||acc(),slow:!!el.dataset.slow}),
  lprev:()=>{if(S.i>0){S.i--;R.learn(ARG)}},
  lnext:()=>{const tp=TOP[ARG];if(S.i<tp.words.length-1){S.i++;R.learn(ARG)}else{S.done=1;S.msg=markTask(me().kind==='adult'?'talk':'learn',ARG);addStars(3);R.learn(ARG)}},
  doflip:()=>{if(S.flipped)return;S.flipped=true;document.getElementById('flipcard').classList.add('on');say(S.deck[0].w);document.getElementById('fbtns').innerHTML=flipBtns(S.deck[0])},
  fok:()=>{S.deck.shift();addStars(1);beep('ok');S.flipped=false;if(!S.deck.length){S.done=1;S.msg=markTask('flash',ARG);addStars(2)}R.flash(ARG)},
  fagain:()=>{S.deck.push(S.deck.shift());S.flipped=false;R.flash(ARG)},
  qsay:()=>{const q=S.quiz.qs[S.qz.i];say(q.say)},
  qsayslow:()=>{const q=S.quiz.qs[S.qz.i];say(q.say,{slow:true})},
  ans:(a,el)=>answer(a,el),
  qnext:()=>{if(S.qnext){const f=S.qnext;S.qnext=null;f()}},
  mic:()=>recStart(h=>{const r=grade(S.speakT||'',h);speakResult(r)}),
  selfok:()=>speakResult({stars:'⭐⭐⭐',msg:pick(PRAISE_VI),n:2}),
  spnext:()=>{S.sp.i++;S.spGot=0;runSpeak(S.speakO)},
  abcone:a=>{const i=+a;const L=C.abc[i];S.abcI=i;const k=me();if(!k.abcSeen.includes(L[0])){k.abcSeen.push(L[0]);save()}
    say(L[0]+' is for '+L[2]);R.abc();ensureToday(k);if(k.abcSeen.length>=13&&!k.today.learn&&k.kind!=='adult'){const m=markTask('learn');addStars(3);toast('🔤 Hoàn thành nhiệm vụ 📖 Học từ mới! +3 ⭐')}},
  abcall:()=>say('ABC song'),
  talkdone:a=>{const m=markTask('talk',a);addStars(2);toast('✅ Đã học xong mẫu câu! +2 ⭐');S.tab='dlg';R.talk(a)},
  ttab:a=>{S.tab=a;R.talk(ARG)},
  playdlg:async a=>{const d=ADL[a].dialogue;for(const x of d){if(SCR!=='talk')break;await say(x[1]);await new Promise(r=>setTimeout(r,350))}},
  dq:a=>doLookup(a),
  askcody:async a=>{const box=document.getElementById('codyans');if(!box||!SAMPLE)return;box.innerHTML='<div class="note">Cody đang trả lời…</div>';
    try{const r=await SAMPLE.json(`Bạn là giáo viên tiếng Anh cho người Việt mới học. Với từ tiếng Anh "${a}", trả về JSON {"loai":"loại từ tiếng Việt","nghia":["1-3 nghĩa tiếng Việt ngắn gọn, phổ biến nhất"],"vidu":[{"en":"câu ví dụ rất đơn giản","vi":"dịch"}],"meo":"1 mẹo nhớ hoặc lưu ý phát âm ngắn"}. Chỉ JSON.`,{modelTier:'quick'});
      box.innerHTML=`<div class="why" style="font-size:18px"><b>${esc(r.loai||'')}</b>: ${esc((r.nghia||[]).join('; '))}${(r.vidu||[]).map(v=>`<div style="margin-top:6px">• <b>${esc(v.en)}</b><br><span style="opacity:.8">${esc(v.vi)}</span></div>`).join('')}${r.meo?`<div style="margin-top:6px">💡 ${esc(r.meo)}</div>`:''}<div class="note">Nghĩa do Cody (AI) giải thích, nên đối chiếu thêm Cambridge.</div></div>`}
    catch(e){box.innerHTML='<div class="note">Chưa hỏi được Cody lúc này. Hãy dùng Cambridge bên dưới.</div>'}},
  setav:a=>{readDraftInputs();S.draft.av=a;S.draft.photo=null;S.draft.photoSrc=null;R.profile(ARG)},
  rmphoto:()=>{readDraftInputs();S.draft.photo=null;S.draft.photoSrc=null;R.profile(ARG)},
  editphoto:()=>{readDraftInputs();S.srcImg=S.draft.photoSrc||S.draft.photo;S.edit=S.draft.photoEdit||{z:1,r:0,x:0,y:0,b:100};nav('photo-'+ARG)},
  rot:a=>{S.edit.r=(S.edit.r+(+a)+360)%360;drawCv()},
  resetimg:()=>{S.edit={z:1,r:0,x:0,y:0,b:100};document.getElementById('zz').value=1;document.getElementById('bb').value=100;drawCv()},
  savephoto:()=>{const c=document.createElement('canvas');c.width=c.height=256;drawCv(c,256);let url;try{url=c.toDataURL('image/jpeg',0.86)}catch(e){toast('Không xử lý được ảnh này');return}
    S.draft.photo=url;S.draft.photoEdit=Object.assign({},S.edit);
    /* giữ ảnh gốc thu nhỏ để chỉnh lại sau */
    try{const o=document.createElement('canvas');const m=Math.min(1,900/Math.max(S.img.width,S.img.height));o.width=Math.round(S.img.width*m);o.height=Math.round(S.img.height*m);o.getContext('2d').drawImage(S.img,0,0,o.width,o.height);S.draft.photoSrc=o.toDataURL('image/jpeg',0.8)}catch(e){}
    nav('profile-'+ARG)},
  saveprof:()=>{readDraftInputs();const p=S.draft;if(!p.name){toast('Hãy nhập tên nhé');return}
    const store=Object.assign({},p);
    if(store.photoSrc&&store.photoSrc.length>400000)delete store.photoSrc;
    const id=ARG==='new'?S.id:ARG;DB.p[id]=store;if(!DB.order.includes(id))DB.order.push(id);save();toast('💾 Đã lưu hồ sơ của '+p.name);nav('start')},
  delprof:()=>{if(!S.confirmDel){S.confirmDel=1;R.profile(ARG);return}delete DB.p[ARG];DB.order=DB.order.filter(x=>x!==ARG);if(DB.cur===ARG)DB.cur=null;save();nav('start')},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.arg,b)}});
/* khi chuyển sang trang profile từ photo, giữ bản nháp */
const _render=render;
render=function(){const keep=(SCR==='photo'||SCR==='profile')?{draft:S.draft,id:S.id,srcImg:S.srcImg,edit:S.edit,img:S.img}:null;const prevArg=ARG;
  const h=(location.hash||'').replace(/^#/,'');const scr=h.split('-')[0];
  if(keep&&(scr==='photo'||scr==='profile')&&h.slice(scr.length+1)===prevArg){SCR=scr;S=Object.assign({},keep)}
  _render()};
render();
if('serviceWorker' in navigator&&!IN_CLAUDE){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
